[package]
name = "kiosk"
version = "0.1.0"
edition = "2021"
description = "Touch-screen self-ordering kiosk for quick-service restaurants"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/adam-ctrlc/self-ordering-kiosk"
keywords = ["kiosk", "self-ordering", "restaurant", "egui", "touchscreen"]
categories = ["gui"]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Optimize dependencies (image decoding, rendering) even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
